plugins {
    id 'fabric-loom' version '1.14.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "smooth_progression" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            ideConfigGenerated = true
            property "fabric.developmentEnvironment", "true"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Puffish Skills is the API used by Smooth Progression.
    modImplementation "maven.modrinth:hqQqvaa4:cYeLbNNg"

    // Smooth Classes is a required runtime dependency in fabric.mod.json.
    // It does not need to be a compile dependency because this project talks
    // to its skill tree through the Puffish Skills API. Add the released
    // Smooth Classes jar as a dev/runtime dependency when using runClient.

    // Other dependencies
    modImplementation "maven.modrinth:8ooWzSQP:G74msHHs"
    modImplementation "maven.modrinth:XvoWJaA2:Fh2MJAAe"
    modImplementation "maven.modrinth:9s6osm5g:2xQdCMyG"
    modImplementation "maven.modrinth:FCFcFw09:GoArx0qR"
    modImplementation "maven.modrinth:gedNE4y2:yDqYTUaf"

    // TinyConfig bundled inside Spell Power
    implementation files("libs/TinyConfig-2.3.2.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
